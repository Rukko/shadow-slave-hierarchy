<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Interactive guide to the soul core hierarchy of Shadow Slave: ranks, classes, power maps and matchups."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0d10" />
    <title>Soul Core Hierarchy</title>
    <link rel="canonical" href="https://shadow-slave-hierarchy.pages.dev/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social previews. Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soul Core Hierarchy" />
    <meta property="og:title" content="Soul Core Hierarchy" />
    <meta
      property="og:description"
      content="Interactive guide to the soul core hierarchy of Shadow Slave: ranks, classes, power maps and matchups."
    />
    <meta property="og:url" content="https://shadow-slave-hierarchy.pages.dev/" />
    <meta property="og:image" content="https://shadow-slave-hierarchy.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Soul Core Hierarchy title next to a dark sea under seven black suns."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong one. Dark is the default.
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('soulcore-theme') === 'light' ? 'light' : 'dark',
        );
      } catch {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
